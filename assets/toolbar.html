<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:13px 'Segoe UI',Arial;background:#eef1f6;color:#202b3c}button{border:0;border-radius:6px;background:transparent;padding:5px 9px;cursor:pointer;font:inherit}button:hover{background:#dbe2ed}button:disabled{opacity:.4;cursor:default}#tabs{display:flex;gap:3px;height:34px;padding:3px 8px;overflow:hidden;background:#dce3ef}.tab{max-width:180px;min-width:55px;flex:1;display:flex;align-items:center;gap:4px;padding:0 4px;border-radius:7px 7px 0 0;cursor:pointer}.tab.active{background:white}.tab span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.tab button{padding:1px 5px}nav{display:flex;align-items:center;gap:5px;height:48px;padding:5px 8px;background:white}nav button{font-size:16px}input{flex:1;min-width:0;height:33px;border:1px solid #ccd3de;border-radius:7px;padding:0 10px}#panel{display:none;position:fixed;right:8px;top:80px;width:390px;max-height:65vh;overflow:auto;background:white;z-index:100;border:1px solid #d1d5db;box-shadow:0 8px 30px #0003;border-radius:9px;padding:12px}#panel.show{display:block}.item{padding:8px 2px;border-bottom:1px solid #eee;overflow-wrap:anywhere;cursor:pointer}.item:hover{background:#f0f4fa}.muted{color:#64748b;font-size:11px}#panelHead{display:flex;justify-content:space-between;align-items:center}
</style></head><body><div id="tabs"></div><nav>
<button title="Quay lại" onclick="send('back')">←</button><button title="Tiếp" onclick="send('forward')">→</button><button title="Tải lại" onclick="send('reload')">↻</button><button title="Trang chủ" onclick="send('home')">⌂</button>
<input id="address" placeholder="Nhập địa chỉ hoặc tìm kiếm" autocomplete="off" spellcheck="false"><button onclick="navigate()">➜</button>
<button title="Đánh dấu trang" id="star" onclick="send('bookmark')">☆</button><button onclick="showPanel('bookmarks')" title="Bookmark">★</button><button onclick="showPanel('history')" title="Lịch sử">◷</button><button id="adblock" onclick="send('adblock-toggle')" title="Bật/tắt chặn quảng cáo">🛡</button>
</nav><section id="panel"><div id="panelHead"><strong id="panelTitle"></strong><button onclick="closePanel()">✕</button></div><div id="panelItems"></div></section>
<script>
const address=document.getElementById('address');let state={tabs:[],active:0,history:[],bookmarks:[],adblock:true,limit:10},panel='';
function send(v){window.ipc.postMessage(v)}function navigate(){send('navigate:'+address.value);closePanel()}
function closePanel(){panel='';document.getElementById('panel').classList.remove('show')}
function showPanel(type){panel=panel===type?'':type;renderPanel()}
function renderPanel(){const p=document.getElementById('panel');p.classList.toggle('show',!!panel);if(!panel)return;document.getElementById('panelTitle').textContent=panel==='history'?'Lịch sử':'Bookmark';const el=document.getElementById('panelItems');el.replaceChildren();if(panel==='history'){const clear=document.createElement('button');clear.textContent='Xóa lịch sử';clear.onclick=()=>send('clear-history');el.append(clear)}const entries=panel==='history'?[...state.history].reverse():state.bookmarks;for(const entry of entries){const div=document.createElement('div');div.className='item';div.textContent=entry.title||entry.url;div.title=entry.url;div.onclick=()=>{send('navigate:'+entry.url);closePanel()};el.append(div)}if(!entries.length){const empty=document.createElement('p');empty.className='muted';empty.textContent='Chưa có dữ liệu';el.append(empty)}}
window.renderState=s=>{state=s;const root=document.getElementById('tabs');root.replaceChildren();for(const t of s.tabs){const el=document.createElement('div');el.className='tab'+(t.id===s.active?' active':'');el.title=t.url;const name=document.createElement('span');try{name.textContent=new URL(t.url).hostname||t.url}catch{name.textContent=t.url}el.append(name);el.onclick=()=>send('switch:'+t.id);const x=document.createElement('button');x.textContent='×';x.title='Đóng tab';x.onclick=e=>{e.stopPropagation();send('close:'+t.id)};el.append(x);root.append(el)}const plus=document.createElement('button');plus.textContent='+';plus.title='Tab mới (tối đa '+s.limit+')';plus.disabled=s.tabs.length>=s.limit;plus.onclick=()=>send('new');root.append(plus);const active=s.tabs.find(t=>t.id===s.active);if(active&&document.activeElement!==address)address.value=active.url;document.getElementById('star').textContent=active&&s.bookmarks.some(b=>b.url===active.url)?'★':'☆';document.getElementById('adblock').textContent=s.adblock?'🛡':'🛡̸';document.getElementById('adblock').title=s.adblock?'Chặn quảng cáo: bật (nhấn để tắt và tải lại tab)':'Chặn quảng cáo: tắt (nhấn để bật và tải lại tab)';renderPanel()};
address.addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key.toLowerCase()==='l'){e.preventDefault();address.focus();address.select()}if(e.ctrlKey&&e.key.toLowerCase()==='t'){e.preventDefault();send('new')}});
</script></body></html>
